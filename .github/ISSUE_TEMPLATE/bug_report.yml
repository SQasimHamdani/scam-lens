name: Bug report
description: Something in scam-lens does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command or code. Remove any personal details from example messages.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: Output of `scam-lens --version`, your Python version and operating system.
    validations:
      required: true
