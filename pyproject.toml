[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-lens"
version = "0.1.0"
description = "Offline, rule-based scam message checker that explains each red flag in plain language."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Syed Qasim Hamdani" }]
keywords = [
    "scam", "phishing", "smishing", "sms", "email-security", "fraud-detection",
    "scam-checker", "cybersecurity", "offline", "privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/SQasimHamdani/scam-lens"
Issues = "https://github.com/SQasimHamdani/scam-lens/issues"

[project.scripts]
scam-lens = "scam_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scam_lens = ["packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
